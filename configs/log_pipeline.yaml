master_rate_hz: 10.0
# Inspector policies only: warnings/statistics, never filtering or corrections.
rate:
  gap_multiplier: 5.0
  absolute_gap_threshold_s: 0.5
physical_checks:
  minimum_samples: 10
  warning_fraction: 0.8
  battery:
    instance: 0
    min_plausible_voltage: 9.0
    max_plausible_voltage: 13.0
    min_flying_current_a: 3.0
  esc:
    min_plausible_voltage: 5.0
    max_plausible_voltage: 60.0
    min_voltage_ratio_to_battery: 0.5
    max_voltage_ratio_to_battery: 1.5
    comparison_max_age_s: 0.2
    zero_current_epsilon_a: 0.01
    rpm_active_floor: 1000.0
    rpm_cross_instance_ratio_warning: 3.0
vibration:
  summary_percentiles: [95, 99]
inspector_availability:
  minimum_paired_samples: 2
  minimum_candidate_duration_s: 0.1
frame_output: ENU
maximum_source_age_ms:
  PSCN: 180
  PSCE: 180
  PSCD: 180
  XKF1: 180
  XKF4: 250
  ATT: 180
  BAT: 180
  RCOU: 180
  CTUN: 180
  GPS: 350
gap_threshold_ms:
  default: 500
  GPS: 600
alignment_method_by_source:
  PSCN: previous
  PSCE: previous
  PSCD: previous
  XKF1: previous
  XKF4: previous
  ATT: previous
  BAT: previous
  RCOU: previous
  CTUN: previous
  GPS: previous
minimum_samples_for_learning: 200
minimum_train_samples: 100
minimum_test_samples: 30
learning_features_by_axis:
  x: [px, py, vx, vy, yaw]
  y: [px, py, vx, vy, yaw]
  z: [pz, vz, yaw]
battery_instance: 0
gps_instance: 0
battery_plausibility_bounds:
  voltage: [9.0, 12.8]
  current: [0.5, 150.0]
velocity_plausibility_bounds: [0.0, 30.0]
acceleration_plausibility_bounds: [-40.0, 40.0]
motor_output_plausibility_bounds: [0, 2200]
split:
  method: chronological
  train_fraction: 0.7
  holdout_flight_id: null
